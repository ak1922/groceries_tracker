{% extends 'base.html' %}

{% block title %}Edit Shopping Trip - GroceryOps{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="p-4 bg-dark text-white rounded-3 shadow-sm d-flex justify-content-between align-items-center">
            <div>
                <a href="{% url 'shopping:dashboard' %}" class="btn btn-sm btn-outline-light mb-2">← Back to Console Tower</a>
                <h3 class="fw-bold mb-0">Modify Trip Parameters: {{ trip.store.name }}</h3>
            </div>
            <span class="badge bg-primary px-3 py-2 fw-semibold">Trip Management Studio</span>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.store.id_for_label }}" class="form-label small fw-bold text-secondary">Assigned Vendor Store</label>
                        {{ form.store }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.date.id_for_label }}" class="form-label small fw-bold text-secondary">Purchase Date</label>
                        {{ form.date }}
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top mt-4">
                        <a href="{% url 'shopping:dashboard' %}" class="btn btn-light fw-medium">Discard</a>
                        <button type="submit" class="btn btn-primary fw-semibold shadow-sm">Save Parameters</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
